<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team.KusuNoKi 公式サイト</title>
<meta name="description" content="謎解き制作団体 Team.KusuNoKi の公式サイトです。">
<link rel="canonical" href="https://team-kusunoki.com/">

<!-- OGP：SNSでシェアされたときの表示 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Team.KusuNoKi">
<meta property="og:title" content="Team.KusuNoKi 公式サイト">
<meta property="og:description" content="謎解き制作団体です。">
<meta property="og:url" content="https://team-kusunoki.com/">
<meta property="og:image" content="https://team-kusunoki.com/images/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="夕空の背景に Team.KusuNoKi のロゴと社章">
<meta name="twitter:card" content="summary_large_image">

<!-- 検索結果に出るサイト名を明示する。旧サイトの情報が残らないようにするため -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://team-kusunoki.com/#website",
      "name": "Team.KusuNoKi",
      "alternateName": ["Team.KusuNoKi 公式サイト", "チームクスノキ"],
      "url": "https://team-kusunoki.com/",
      "inLanguage": "ja",
      "publisher": { "@id": "https://team-kusunoki.com/#organization" }
    },
    {
      "@type": "Organization",
      "@id": "https://team-kusunoki.com/#organization",
      "name": "Team.KusuNoKi",
      "alternateName": "チームクスノキ",
      "url": "https://team-kusunoki.com/",
      "logo": "https://team-kusunoki.com/images/logo-v2.png",
      "foundingDate": "2025",
      "description": "謎解き制作団体です。"
    }
  ]
}
</script>

<link rel="icon" href="/images/logo-v2.png" media="(prefers-color-scheme: light)">
<link rel="icon" href="/images/logo-dark-v2.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/images/logo-v2.png">
<link rel="stylesheet" href="/css/style.css?v=20261114zc">
<!-- JSが動く環境でだけ演出を有効にする（表示前に判定してちらつきを防ぐ） -->
<script>document.documentElement.className += ' js';</script>
</head>
<body>

<!-- 初回表示のときだけ出るローディング -->
<div class="loader" aria-hidden="true">
  <div class="loader__mark"><img src="/images/logo-v2.png" alt=""></div>
</div>

<!-- マウスに追従するぼんやりした光 -->
<div class="glow" aria-hidden="true"></div>

<!-- ロゴと、作品一覧・お問い合わせ -->
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/">
      <img class="brand__mark" src="/images/logo-v2.png" alt="">
      <span class="brand__name">Team.KusuNoKi</span>
    </a>

    <div class="header-tools">
      <nav class="header-nav" aria-label="ページ">
        <a href="/works/">作品一覧</a>
        <a href="/contact/">お問い合わせ</a>
      </nav>
      <nav class="sns-links" aria-label="SNS">
        <a href="https://x.com/teamkusunoki" target="_blank" rel="noopener" aria-label="X（@teamkusunoki）">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="https://www.instagram.com/team.kusunoki" target="_blank" rel="noopener" aria-label="Instagram（@team.kusunoki）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.1" cy="6.9" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
      </nav>
    </div>
  </div>
</header>

<main>

  <!-- ヒーロー：空の背景と団体紹介。スクロールすると空が夜へ沈む -->
  <section class="hero" id="top">
    <div class="hero__photo" aria-hidden="true"></div>
    <div class="hero__photo hero__photo--night" aria-hidden="true"></div>

    <div class="wrap hero__inner" data-stagger="140">
      <p class="hero__eyebrow" data-reveal="up"><span class="tick"></span>京都発・物語のある謎解き</p>
      <h1 class="hero__heading" data-reveal="up">Team.KusuNoKiとは</h1>

      <p class="hero__desc" data-reveal="up">
        京都大学の学生を中心とした謎解き制作団体です。11月祭（NF）での出展を中心に活動しております。<br class="hero__break">
        2025年に「クスノキが枯れた日」を制作しました。2026年は第2作「11月の救祭」を販売予定です。
      </p>

      <div class="btn-row hero__actions" data-reveal="up">
        <a class="btn btn--light" href="/works/">作品を見る</a>
        <a class="btn btn--ghost" href="/contact/">お問い合わせ</a>
      </div>
    </div>

    <div class="hero__works" data-reveal="up">
      <a class="hero__work" href="/works/november-kyusai/">
        <div class="book-stack" data-book-stack>
          <div class="book book--mei">
            <img src="/images/november/book-mei.jpg" alt="">
          </div>
          <div class="book book--yoi">
            <img src="/images/november/book-yoi.jpg" alt="">
          </div>
        </div>
        <p class="hero__work-copy">
          <span class="hero__work-name">11月の救祭</span>
          <span class="hero__work-when">販売時期<span>11/20~11/23</span></span>
        </p>
      </a>
    </div>
  </section>

</main>

<script src="/js/main.js?v=20261114zc"></script>
</body>
</html>
