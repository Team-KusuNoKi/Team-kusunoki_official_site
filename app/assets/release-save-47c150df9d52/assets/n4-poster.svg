<svg xmlns="http://www.w3.org/2000/svg" width="559" height="793" viewBox="0 0 559 793">
  <title>末席同好会の部員募集ポスター</title>
  <desc>縦書きの「末席同好会」。末はピンク、席は紫。「部員大募集中」の大は緑。「詳しくは裏面に」と下向き矢印。右に「一緒に、全国の『末席』に座りませんか？」と椅子。</desc>
  <rect width="559" height="793" fill="white"/>
  <g font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" font-weight="bold" text-anchor="middle">
    <g font-size="132"><text x="303" y="170" fill="#f15ff3">末</text><text x="303" y="298" fill="#6c00ff">席</text><text x="303" y="426">同</text><text x="303" y="554">好</text><text x="303" y="682">会</text></g>
    <g font-size="70"><text x="142" y="140">部</text><text x="142" y="212">員</text><text x="142" y="284" fill="#54823a">大</text><text x="142" y="356">募</text><text x="142" y="428">集</text><text x="142" y="500">中</text></g>
    <text x="66" y="322" writing-mode="vertical-rl" text-anchor="start" dominant-baseline="central" font-size="49" letter-spacing="3" fill="#b96016">詳しくは裏面に</text>
    <text x="472" y="89" writing-mode="vertical-rl" text-anchor="start" dominant-baseline="central" font-size="28" letter-spacing="1.2">一緒に、全国の『末席』に座りませんか？</text>
  </g>
  <path d="M57 671h18v29h9l-18 19-18-19h9z" fill="#050505"/>
  <path d="m456 664 51 12v52h-8v-19l-36-9v8l43 17v47h-8v-39l-20 8v31h-8v-34l-31-13v40h-8v-47l25-15zM463 677v16l36 8v-16z" fill="#050505" fill-rule="evenodd"/>
</svg>
